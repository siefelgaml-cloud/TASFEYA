<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مراجعة وتصفية الرحلات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-calculator text-yellow-400"></i>
                نظام تصفية ومراجعة الرحلات
            </h1>
            <div id="sync-status" class="text-xs bg-indigo-800 px-3 py-1 rounded-full text-indigo-200">
                <i class="fa-solid fa-wifi text-emerald-400"></i> متصل
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-white border-b sticky top-0 z-10 shadow-sm">
        <div class="container mx-auto flex">
            <button onclick="showTab('submit')" id="tab-btn-submit" class="py-3 px-6 font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> تقديم تصفية
            </button>
            <button onclick="showTab('review')" id="tab-btn-review" class="py-3 px-6 font-bold text-gray-500 hover:text-gray-800 border-b-2 border-transparent flex items-center gap-2">
                <i class="fa-solid fa-list-check"></i> المراجعة والأرشيف
                <span id="badge-pending" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
            </button>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="container mx-auto p-4 md:p-6 max-w-4xl">

        <!-- SUBMIT SECTION -->
        <section id="sec-submit" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-bold mb-4 text-indigo-900 border-b pb-2">بيانات الجولة</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">اسم المرشد</label>
                        <input type="text" id="guide-name" placeholder="أدخل الاسم" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">رقم الرحلة / الكود</label>
                        <input type="text" id="tour-code" placeholder="مثال: 105" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">التاريخ</label>
                        <input type="date" id="tour-date" class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Incomes -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-md font-bold text-emerald-700">المقبوضات (الإيرادات)</h2>
                    <button onclick="addIncomeField()" class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg font-bold hover:bg-emerald-200">+ إضافة بند</button>
                </div>
                <div id="income-list" class="space-y-2"></div>
                <div class="mt-4 pt-2 border-t flex justify-between font-bold text-sm text-emerald-800">
                    <span>إجمالي المقبوضات:</span>
                    <span id="txt-total-income">0 EGP</span>
                </div>
            </div>

            <!-- Expenses -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-md font-bold text-rose-700">المصروفات والتكاليف</h2>
                    <button onclick="addExpenseField()" class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-lg font-bold hover:bg-rose-200">+ إضافة بند</button>
                </div>
                <div id="expense-list" class="space-y-2"></div>
                <div class="mt-4 pt-2 border-t flex justify-between font-bold text-sm text-rose-800">
                    <span>إجمالي المصروفات:</span>
                    <span id="txt-total-expense">0 EGP</span>
                </div>
            </div>

            <!-- Summary & Action -->
            <div class="bg-gray-900 text-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <div class="text-xs text-gray-400">الصافي النهائي:</div>
                    <div id="txt-net-amount" class="text-xl font-bold mt-1">0 EGP</div>
                </div>
                <button onclick="sendSettlement()" class="w-full md:w-auto bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold px-8 py-3 rounded-lg text-sm shadow">
                    إرسال التصفية للمراجعة
                </button>
            </div>
        </section>

        <!-- REVIEW SECTION -->
        <section id="sec-review" class="hidden space-y-6">
            <!-- Password Check -->
            <div id="pin-screen" class="bg-white p-6 rounded-xl shadow-sm text-center max-w-sm mx-auto my-8 border">
                <h3 class="font-bold text-sm mb-2">أدخل كلمة المرور للعرض</h3>
                <input type="password" id="input-pin" class="w-full p-2 border rounded mb-3 text-center tracking-widest text-lg">
                <button onclick="verifyPin()" class="w-full bg-indigo-900 text-white font-bold py-2 rounded text-sm">دخول</button>
            </div>

            <div id="review-panel" class="hidden space-y-6">
                <div class="flex border-b bg-white rounded-lg p-1 text-sm font-bold">
                    <button onclick="filterReview('pending')" id="subtab-pending" class="flex-1 py-2 text-center rounded bg-indigo-100 text-indigo-900">طلبات معلقة</button>
                    <button onclick="filterReview('archive')" id="subtab-archive" class="flex-1 py-2 text-center rounded text-gray-500">الأرشيف المعتمد</button>
                </div>

                <div id="cards-container" class="space-y-4"></div>
            </div>
        </section>

    </main>

    <!-- Modal Details -->
    <div id="modal-view" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div id="modal-content"></div>
            <div class="flex justify-end gap-2 border-t pt-4">
                <button onclick="closeModal()" class="px-4 py-1.5 border rounded text-xs font-bold">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            databaseURL: "https://tasfeya-3c84d-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const AUTH_PIN = "991997";
        let allData = [];
        let currentFilter = 'pending';

        window.onload = () => {
            document.getElementById('tour-date').valueAsDate = new Date();
            addIncomeField();
            addExpenseField();
            initRealtimeSync();
        };

        function showTab(tab) {
            document.getElementById('sec-submit').classList.add('hidden');
            document.getElementById('sec-review').classList.add('hidden');
            document.getElementById('tab-btn-submit').className = "py-3 px-6 font-bold text-gray-500 border-b-2 border-transparent flex items-center gap-2";
            document.getElementById('tab-btn-review').className = "py-3 px-6 font-bold text-gray-500 border-b-2 border-transparent flex items-center gap-2";

            if(tab === 'submit') {
                document.getElementById('sec-submit').classList.remove('hidden');
                document.getElementById('tab-btn-submit').className = "py-3 px-6 font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2";
            } else {
                document.getElementById('sec-review').classList.remove('hidden');
                document.getElementById('tab-btn-review').className = "py-3 px-6 font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-2";
            }
        }

        function addIncomeField() {
            const container = document.getElementById('income-list');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="البيان" class="inc-desc flex-grow p-2 border rounded text-xs">
                <input type="number" placeholder="المبلغ" oninput="recalc()" class="inc-val w-28 p-2 border rounded text-xs font-bold text-emerald-600">
                <button onclick="this.parentElement.remove(); recalc();" class="text-red-500 p-2 text-xs"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function addExpenseField() {
            const container = document.getElementById('expense-list');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="البيان" class="exp-desc flex-grow p-2 border rounded text-xs">
                <input type="number" placeholder="المبلغ" oninput="recalc()" class="exp-val w-28 p-2 border rounded text-xs font-bold text-rose-600">
                <button onclick="this.parentElement.remove(); recalc();" class="text-red-500 p-2 text-xs"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(div);
        }

        function recalc() {
            let incTotal = 0, expTotal = 0;
            document.querySelectorAll('.inc-val').forEach(i => incTotal += Number(i.value) || 0);
            document.querySelectorAll('.exp-val').forEach(e => expTotal += Number(e.value) || 0);
            const net = incTotal - expTotal;

            document.getElementById('txt-total-income').innerText = `${incTotal.toLocaleString()} EGP`;
            document.getElementById('txt-total-expense').innerText = `${expTotal.toLocaleString()} EGP`;
            document.getElementById('txt-net-amount').innerText = `${net.toLocaleString()} EGP`;

            return { incTotal, expTotal, net };
        }

        function sendSettlement() {
            const name = document.getElementById('guide-name').value.trim();
            const code = document.getElementById('tour-code').value.trim();
            const date = document.getElementById('tour-date').value;

            if(!name || !code) {
                alert('من فضلك ادخل الاسم ورقم الرحلة');
                return;
            }

            const incomes = [];
            document.querySelectorAll('#income-list > div').forEach(row => {
                const desc = row.querySelector('.inc-desc').value.trim();
                const val = Number(row.querySelector('.inc-val').value) || 0;
                if(desc && val) incomes.push({ desc, val });
            });

            const expenses = [];
            document.querySelectorAll('#expense-list > div').forEach(row => {
                const desc = row.querySelector('.exp-desc').value.trim();
                const val = Number(row.querySelector('.exp-val').value) || 0;
                if(desc && val) expenses.push({ desc, val });
            });

            const totals = recalc();
            const item = {
                id: 'ORD-' + Date.now(),
                name, code, date,
                incomes, expenses,
                incTotal: totals.incTotal,
                expTotal: totals.expTotal,
                net: totals.net,
                status: 'pending'
            };

            db.ref('orders/' + item.id).set(item).then(() => {
                alert('تم الإرسال بنجاح!');
                document.getElementById('guide-name').value = '';
                document.getElementById('tour-code').value = '';
                document.getElementById('income-list').innerHTML = '';
                document.getElementById('expense-list').innerHTML = '';
                addIncomeField();
                addExpenseField();
                recalc();
            });
        }

        function initRealtimeSync() {
            db.ref('orders').on('value', snapshot => {
                const val = snapshot.val();
                allData = val ? Object.values(val) : [];
                
                const pendingCount = allData.filter(x => x.status === 'pending').length;
                const badge = document.getElementById('badge-pending');
                if(pendingCount > 0) {
                    badge.innerText = pendingCount;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                renderCards();
            });
        }

        function verifyPin() {
            if(document.getElementById('input-pin').value === AUTH_PIN) {
                document.getElementById('pin-screen').classList.add('hidden');
                document.getElementById('review-panel').classList.remove('hidden');
                renderCards();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function filterReview(type) {
            currentFilter = type;
            document.getElementById('subtab-pending').className = type === 'pending' ? "flex-1 py-2 text-center rounded bg-indigo-100 text-indigo-900" : "flex-1 py-2 text-center rounded text-gray-500";
            document.getElementById('subtab-archive').className = type === 'archive' ? "flex-1 py-2 text-center rounded bg-indigo-100 text-indigo-900" : "flex-1 py-2 text-center rounded text-gray-500";
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            if(!container) return;
            container.innerHTML = '';

            const items = allData.filter(x => currentFilter === 'pending' ? x.status === 'pending' : x.status === 'approved');

            if(items.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-400 text-sm">لا توجد طلبات هنا</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-sm text-gray-800">${item.name} <span class="text-xs text-indigo-600">(${item.code})</span></div>
                        <div class="text-xs text-gray-500 mt-1">التاريخ: ${item.date} | الصافي: <b class="text-gray-800">${item.net.toLocaleString()} EGP</b></div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="viewDetails('${item.id}')" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded text-xs font-bold">عرض</button>
                        ${item.status === 'pending' ? `<button onclick="approveOrder('${item.id}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-bold">اعتماد</button>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function viewDetails(id) {
            const item = allData.find(x => x.id === id);
            if(!item) return;

            document.getElementById('modal-content').innerHTML = `
                <h3 class="font-bold text-md mb-2 border-b pb-2">تفاصيل التصفية - ${item.name} (${item.code})</h3>
                <p class="text-xs text-gray-500 mb-4">التاريخ: ${item.date}</p>
                <div class="space-y-3 text-xs">
                    <div>
                        <div class="font-bold text-emerald-700 mb-1">المقبوضات:</div>
                        ${(item.incomes || []).map(i => `<div class="flex justify-between py-1 border-b"><span>${i.desc}</span><span>${i.val} EGP</span></div>`).join('')}
                    </div>
                    <div>
                        <div class="font-bold text-rose-700 mb-1">المصروفات:</div>
                        ${(item.expenses || []).map(e => `<div class="flex justify-between py-1 border-b"><span>${e.desc}</span><span>${e.val} EGP</span></div>`).join('')}
                    </div>
                    <div class="pt-2 font-bold text-sm flex justify-between">
                        <span>الصافي:</span>
                        <span>${item.net.toLocaleString()} EGP</span>
                    </div>
                </div>
            `;
            document.getElementById('modal-view').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-view').classList.add('hidden');
        }

        function approveOrder(id) {
            if(confirm('هل تريد اعتماد هذه التصفية؟')) {
                db.ref('orders/' + id + '/status').set('approved');
            }
        }
    </script>
</body>
</html>
